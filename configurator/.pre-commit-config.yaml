repos:
  # Python 代码格式化
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  # Python 代码检查
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.2
    hooks:
      - id: flake8
        args: [--config=configurator/.flake8]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.2
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      # - id: ruff-format
